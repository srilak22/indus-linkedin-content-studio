<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="bgGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C16"/>
      <stop offset="50%" stop-color="#0A1828"/>
      <stop offset="100%" stop-color="#122538"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bgGradC)"/>

  <!-- Frame -->
  <rect x="40" y="40" width="1120" height="1120" rx="20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <line x1="40" y1="150" x2="1160" y2="150" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(80, 70)">
    <polygon points="0,0 28,0 42,22 28,45 0,45 14,22" fill="#0066CC"/>
    <circle cx="21" cy="22" r="7" fill="#FF6B00"/>
    <text x="60" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="2">INDUS</text>
    <text x="60" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#94A3B8" letter-spacing="2.5">INDUSTRY APPLICATIONS</text>
  </g>

  <g transform="translate(820, 80)">
    <rect x="0" y="0" width="130" height="32" rx="16" fill="rgba(0,102,204,0.2)" stroke="#0066CC" stroke-width="1"/>
    <text x="65" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#60A5FA" text-anchor="middle">INDUS-LI-041</text>
    
    <rect x="145" y="0" width="155" height="32" rx="16" fill="rgba(255,107,0,0.15)" stroke="#FF6B00" stroke-width="1"/>
    <text x="222" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#FDBA74" text-anchor="middle">WORKCELL DEPLOYMENT</text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(80, 190)">
    <rect x="0" y="0" width="360" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="16" cy="17" r="5" fill="#FF6B00"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#94A3B8" letter-spacing="1">INDUSTRY APPLICATIONS</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="42" fill="#FFFFFF">
    <tspan x="80" dy="0">Hygienic Food Processing</tspan>
    <tspan x="80" dy="50" fill="#38BDF8"></tspan>
  </text>

  <!-- Center Artwork: Industrial Automation Cell Process Flow -->
  <g transform="translate(80, 385)">
    <rect width="1040" height="445" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <text x="40" y="45" font-family="monospace" font-size="12" fill="#64748B" letter-spacing="1.5">MANUFACTURING CELL ARCHITECTURE // 3-STAGE WORKFLOW</text>

    <!-- 3 Stage Process Cards -->
    <g transform="translate(50, 100)">
      <!-- Stage 1 -->
      <g transform="translate(0, 0)">
        <rect width="280" height="240" rx="12" fill="#0B1A2E" stroke="#0066CC" stroke-width="1.5"/>
        <rect x="20" y="20" width="36" height="36" rx="6" fill="#0066CC"/>
        <text x="38" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">1</text>
        <text x="70" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">Part Infeed &amp; Align</text>
        <text x="20" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">3D Structured Light Vision scans part orientation with sub-millimeter precision.</text>
        <rect x="20" y="170" width="240" height="45" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="32" y="198" font-family="monospace" font-size="12" fill="#38BDF8">Telemetry: 120 ms Point Cloud</text>
      </g>

      <!-- Arrow 1 -> 2 -->
      <path d="M 295 120 L 335 120" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4 4"/>
      <polygon points="340,120 330,114 330,126" fill="#38BDF8"/>

      <!-- Stage 2 -->
      <g transform="translate(350, 0)">
        <rect width="280" height="240" rx="12" fill="#0B1A2E" stroke="#FF6B00" stroke-width="1.5"/>
        <rect x="20" y="20" width="36" height="36" rx="6" fill="#FF6B00"/>
        <text x="38" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">2</text>
        <text x="70" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">Coordinated Motion</text>
        <text x="20" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">6-Axis Articulation with active force feedback executes contouring.</text>
        <rect x="20" y="170" width="240" height="45" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="32" y="198" font-family="monospace" font-size="12" fill="#FDBA74">EtherCAT Loop: 250 µs Cycle</text>
      </g>

      <!-- Arrow 2 -> 3 -->
      <path d="M 645 120 L 685 120" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4 4"/>
      <polygon points="690,120 680,114 680,126" fill="#38BDF8"/>

      <!-- Stage 3 -->
      <g transform="translate(700, 0)">
        <rect width="280" height="240" rx="12" fill="#0B1A2E" stroke="#10B981" stroke-width="1.5"/>
        <rect x="20" y="20" width="36" height="36" rx="6" fill="#10B981"/>
        <text x="38" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">3</text>
        <text x="70" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">Outfeed &amp; Palletize</text>
        <text x="20" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Finished assembly verified and transferred via autonomous AMR fleet.</text>
        <rect x="20" y="170" width="240" height="45" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="32" y="198" font-family="monospace" font-size="12" fill="#6EE7B7">Transit: Natural LiDAR SLAM</text>
      </g>
    </g>

    <text x="40" y="415" font-family="monospace" font-size="11" fill="#64748B">FIELD INTEGRATION DOSSIER // WORKCELL OPERATING ENVELOPE</text>
  </g>

  <!-- 4 Metrics Cards -->
  <g transform="translate(80, 860)">
    
    <g transform="translate(0, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Ingress Rating</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">IP69K High-Pressure Steam Washdown (100 bar)</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#0066CC" stroke-width="2"/>
    </g>
    <g transform="translate(266, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Material</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">AISI 316L Electro-Polished Stainless Steel</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#FF6B00" stroke-width="2"/>
    </g>
    <g transform="translate(532, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Cycle Rate</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">Up to 180 Picks Per Minute</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#10B981" stroke-width="2"/>
    </g>
    <g transform="translate(798, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Lubrication</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">NSF H1 Food-Grade Synthetic Grease</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#F59E0B" stroke-width="2"/>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 1050)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748B" font-weight="600">SECTOR ENGINEERING // AUTOMATION DEPLOYMENT SERIES</text>
    <text x="1040" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#38BDF8" font-weight="700" text-anchor="end">indusrobotics.com</text>
  </g>
</svg>