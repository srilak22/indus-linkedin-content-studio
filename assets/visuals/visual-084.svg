<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="bgGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="50%" stop-color="#0B192A"/>
      <stop offset="100%" stop-color="#15263B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bgGradF)"/>

  <!-- Accents -->
  <circle cx="850" cy="850" r="260" fill="#16B981" opacity="0.08" filter="blur(80px)"/>

  <!-- Outer frame -->
  <rect x="40" y="40" width="1120" height="1120" rx="16" fill="none" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
  <line x1="40" y1="140" x2="1160" y2="140" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(80, 68)">
    <polygon points="0,0 26,0 38,20 26,40 0,40 12,20" fill="#0879E8"/>
    <circle cx="19" cy="20" r="6" fill="#16B981"/>
    <text x="56" y="22" font-family="'Manrope', sans-serif" font-weight="900" font-size="22" fill="#F4F7FB" letter-spacing="2">INDUS</text>
    <text x="56" y="37" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#A8B6C8" letter-spacing="2">EXCELLENCE IN AUTOMATION</text>
  </g>

  <!-- Badges -->
  <g transform="translate(800, 75)">
    <rect x="0" y="0" width="140" height="34" rx="17" fill="rgba(8, 121, 232, 0.2)" stroke="#0879E8" stroke-width="1.2"/>
    <text x="70" y="22" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#20B8F5" text-anchor="middle">INDUS-LI-084</text>
    
    <rect x="155" y="0" width="165" height="34" rx="17" fill="rgba(22, 185, 129, 0.15)" stroke="#16B981" stroke-width="1.2"/>
    <text x="237" y="22" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#16B981" text-anchor="middle">LEADERSHIP DOSSIER</text>
  </g>

  <!-- Category Pill -->
  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="340" height="32" rx="8" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#16B981"/>
    <text x="32" y="21" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#A8B6C8" letter-spacing="1">COMPANY &amp; BRAND AWARENESS</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="270" font-family="'Manrope', sans-serif" font-weight="900" font-size="44" fill="#F4F7FB">
    <tspan x="80" dy="0">Our Vision for Industrial Automation</tspan>
    <tspan x="80" dy="54" fill="#20B8F5"></tspan>
  </text>

  <!-- Metrology & Standards Framework -->
  <g transform="translate(80, 380)">
    <rect width="1040" height="450" rx="16" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>

    <g transform="translate(50, 60)">
      <!-- Box 1 -->
      <g transform="translate(0, 0)">
        <rect width="450" height="130" rx="10" fill="#15263B" stroke="#0879E8" stroke-width="1.5"/>
        <text x="24" y="38" font-family="'Manrope', sans-serif" font-weight="800" font-size="16" fill="#F4F7FB">ISO 9283 Dynamic Tracking</text>
        <text x="24" y="66" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8">3D Laser tracking dynamic multi-axis path accuracy validation.</text>
        <text x="24" y="104" font-family="'JetBrains Mono', monospace" font-size="12" fill="#20B8F5">Benchmark: ±0.02 mm Pose Window</text>
      </g>

      <!-- Box 2 -->
      <g transform="translate(490, 0)">
        <rect width="450" height="130" rx="10" fill="#15263B" stroke="#16B981" stroke-width="1.5"/>
        <text x="24" y="38" font-family="'Manrope', sans-serif" font-weight="800" font-size="16" fill="#F4F7FB">Accelerated Life Torture Testing</text>
        <text x="24" y="66" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8">10M Continuous reversing torque cycles at 150% rated load.</text>
        <text x="24" y="104" font-family="'JetBrains Mono', monospace" font-size="12" fill="#16B981">Standard: 20,000 Hours Design Life</text>
      </g>

      <!-- Box 3 -->
      <g transform="translate(0, 160)">
        <rect width="450" height="130" rx="10" fill="#15263B" stroke="#FF8A30" stroke-width="1.5"/>
        <text x="24" y="38" font-family="'Manrope', sans-serif" font-weight="800" font-size="16" fill="#F4F7FB">Thermal Environmental Chamber</text>
        <text x="24" y="66" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8">Sealed thermal stress cycling from -40°C to +120°C testing synthetic grease.</text>
        <text x="24" y="104" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FF8A30">Thermal Range: -40°C to +120°C</text>
      </g>

      <!-- Box 4 -->
      <g transform="translate(490, 160)">
        <rect width="450" height="130" rx="10" fill="#15263B" stroke="#20B8F5" stroke-width="1.5"/>
        <text x="24" y="38" font-family="'Manrope', sans-serif" font-weight="800" font-size="16" fill="#F4F7FB">Sub-Micron Grinding Metrology</text>
        <text x="24" y="66" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8">Climate-controlled gear flank grinding at 20.0°C ±0.2°C holding 0.8 µm tolerances.</text>
        <text x="24" y="104" font-family="'JetBrains Mono', monospace" font-size="12" fill="#20B8F5">Tolerance: &lt; 0.8 µm Flank Precision</text>
      </g>
    </g>

    <text x="40" y="420" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A8B6C8">METROLOGY LABORATORY STANDARDS // TESTING METHODOLOGY</text>
  </g>

  <!-- Metrics Grid -->
  <g transform="translate(80, 860)">
    
    <g transform="translate(0, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Protocol Philosophy</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#0879E8" font-weight="700">100% open and standardized industrial protocols</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#0879E8" stroke-width="2.5"/>
    </g>
    <g transform="translate(265, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Supported Stacks</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#20B8F5" font-weight="700">EtherCAT, ROS 2, OPC UA, CANopen, IEC 61131-3</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#20B8F5" stroke-width="2.5"/>
    </g>
    <g transform="translate(530, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Software Freedom</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#FF8A30" font-weight="700">Open SDKs, C++ APIs, and ROS 2 drivers on GitHub</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#FF8A30" stroke-width="2.5"/>
    </g>
    <g transform="translate(795, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Axis Scalability</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#16B981" font-weight="700">Coordinated scaling from 1 to 64 motion axes</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#16B981" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 1050)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
    <text x="0" y="38" font-family="'Inter', sans-serif" font-size="13" fill="#A8B6C8" font-weight="600">ENTERPRISE AUTOMATION // ENGINEERING-FIRST STRATEGY</text>
    <text x="1040" y="38" font-family="'JetBrains Mono', monospace" font-size="13" fill="#20B8F5" font-weight="700" text-anchor="end">indusrobotics.com</text>
  </g>
</svg>