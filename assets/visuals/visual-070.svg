<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="bgGradE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060E1A"/>
      <stop offset="50%" stop-color="#0C1B2E"/>
      <stop offset="100%" stop-color="#14263D"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bgGradE)"/>

  <!-- Frame -->
  <rect x="40" y="40" width="1120" height="1120" rx="20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <line x1="40" y1="150" x2="1160" y2="150" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(80, 70)">
    <polygon points="0,0 28,0 42,22 28,45 0,45 14,22" fill="#0066CC"/>
    <circle cx="21" cy="22" r="7" fill="#FF6B00"/>
    <text x="60" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="2">INDUS</text>
    <text x="60" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#94A3B8" letter-spacing="2.5">EDUCATIONAL SERIES</text>
  </g>

  <g transform="translate(820, 80)">
    <rect x="0" y="0" width="130" height="32" rx="16" fill="rgba(0,102,204,0.2)" stroke="#0066CC" stroke-width="1"/>
    <text x="65" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#60A5FA" text-anchor="middle">INDUS-LI-070</text>
    
    <rect x="145" y="0" width="155" height="32" rx="16" fill="rgba(59,130,246,0.15)" stroke="#3B82F6" stroke-width="1"/>
    <text x="222" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#93C5FD" text-anchor="middle">NUMBERED EXPLAINER</text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(80, 190)">
    <rect x="0" y="0" width="360" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="16" cy="17" r="5" fill="#3B82F6"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#94A3B8" letter-spacing="1">EDUCATIONAL & TECHNICAL CONTENT</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="42" fill="#FFFFFF">
    <tspan x="80" dy="0">Industrial Robot Safety Standards 101</tspan>
    <tspan x="80" dy="50" fill="#38BDF8"></tspan>
  </text>

  <!-- Center Artwork: Numbered Step Breakdown & Formula Box -->
  <g transform="translate(80, 385)">
    <rect width="1040" height="445" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <text x="40" y="45" font-family="monospace" font-size="12" fill="#64748B" letter-spacing="1.5">STEP-BY-STEP ENGINEERING FOUNDATIONS // ROBOTICS THEORY</text>

    <!-- 3 Numbered Educational Steps -->
    <g transform="translate(50, 95)">
      <!-- Step 01 -->
      <g transform="translate(0, 0)">
        <rect width="280" height="180" rx="10" fill="#0B1A2E" stroke="#38BDF8" stroke-width="1.5"/>
        <text x="24" y="45" font-family="monospace" font-size="28" fill="#38BDF8" font-weight="900">01</text>
        <text x="75" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">Joint Kinematics</text>
        <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Serial D-H parameters compute relative coordinate frames from base to wrist.</text>
        <text x="24" y="150" font-family="monospace" font-size="11" fill="#60A5FA">Matrix: T_i = Rot(z)·Trans(d)</text>
      </g>

      <!-- Step 02 -->
      <g transform="translate(345, 0)">
        <rect width="280" height="180" rx="10" fill="#0B1A2E" stroke="#FF6B00" stroke-width="1.5"/>
        <text x="24" y="45" font-family="monospace" font-size="28" fill="#FF6B00" font-weight="900">02</text>
        <text x="75" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">Reduction &amp; Torque</text>
        <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Strain-wave and RV gearing multiply motor torque while preserving rigidity.</text>
        <text x="24" y="150" font-family="monospace" font-size="11" fill="#FDBA74">Ratio: i = 30:1 to 160:1</text>
      </g>

      <!-- Step 03 -->
      <g transform="translate(690, 0)">
        <rect width="280" height="180" rx="10" fill="#0B1A2E" stroke="#10B981" stroke-width="1.5"/>
        <text x="24" y="45" font-family="monospace" font-size="28" fill="#10B981" font-weight="900">03</text>
        <text x="75" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">Feedback Telemetry</text>
        <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Dual 23-bit absolute optical encoders verify position before and after gearing.</text>
        <text x="24" y="150" font-family="monospace" font-size="11" fill="#6EE7B7">Counts: 8.38M counts/rev</text>
      </g>
    </g>

    <!-- Formula Callout Box -->
    <g transform="translate(50, 310)">
      <rect width="940" height="90" rx="10" fill="#071322" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="30" y="35" font-family="monospace" font-size="12" fill="#F59E0B" font-weight="bold">GOVERNING DYNAMIC FORMULA:</text>
      <text x="30" y="68" font-family="monospace" font-size="16" fill="#38BDF8" font-weight="bold">τ_joint = J_load(q)·q̈ + C(q, q̇)·q̇ + g(q) + F_friction</text>
      <text x="910" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8" text-anchor="end">Euler-Lagrange Equation of Motion</text>
    </g>

    <text x="40" y="425" font-family="monospace" font-size="11" fill="#64748B">ROBOTICS CURRICULUM REFERENCE // MECHATRONICS HANDBOOK</text>
  </g>

  <!-- 4 Metrics Cards -->
  <g transform="translate(80, 860)">
    
    <g transform="translate(0, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">ISO 10218-1</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">Robot Design, Construction, and Functional Safety</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#0066CC" stroke-width="2"/>
    </g>
    <g transform="translate(266, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">ISO 10218-2</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">Workcell Integration, Layout, and Safeguarding</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#FF6B00" stroke-width="2"/>
    </g>
    <g transform="translate(532, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">ISO/TS 15066</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">Collaborative Operation Force and Pressure Limits</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#10B981" stroke-width="2"/>
    </g>
    <g transform="translate(798, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Risk Assessment</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">Mandatory Task-Based Risk Assessment (ISO 12100)</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#F59E0B" stroke-width="2"/>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 1050)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748B" font-weight="600">EDUCATIONAL ENGINEERING RESOURCES // INDUS ACADEMIA</text>
    <text x="1040" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#38BDF8" font-weight="700" text-anchor="end">indusrobotics.com</text>
  </g>
</svg>