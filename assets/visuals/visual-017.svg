<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060E1A"/>
      <stop offset="50%" stop-color="#0B1A2E"/>
      <stop offset="100%" stop-color="#14243B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,102,204,0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="1200" fill="url(#bgGrad)"/>
  <rect width="1200" height="1200" fill="url(#grid)"/>

  <!-- Glowing background accents -->
  <circle cx="250" cy="250" r="280" fill="#0066CC" opacity="0.1" filter="blur(70px)"/>
  <circle cx="950" cy="950" r="280" fill="#FF6B00" opacity="0.08" filter="blur(80px)"/>

  <!-- Outer frame -->
  <rect x="40" y="40" width="1120" height="1120" rx="20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <line x1="40" y1="150" x2="1160" y2="150" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Header Branding -->
  <g transform="translate(80, 70)">
    <polygon points="0,0 28,0 42,22 28,45 0,45 14,22" fill="#0066CC"/>
    <circle cx="21" cy="22" r="7" fill="#FF6B00"/>
    <text x="60" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="2">INDUS</text>
    <text x="60" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#94A3B8" letter-spacing="2.5">INDUSTRIAL ROBOTICS</text>
  </g>

  <!-- Badges -->
  <g transform="translate(820, 80)">
    <rect x="0" y="0" width="130" height="32" rx="16" fill="rgba(0,102,204,0.2)" stroke="#0066CC" stroke-width="1"/>
    <text x="65" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#60A5FA" text-anchor="middle">INDUS-LI-017</text>
    
    <rect x="145" y="0" width="155" height="32" rx="16" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="1"/>
    <text x="222" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#34D399" text-anchor="middle">PRODUCT SPOTLIGHT</text>
  </g>

  <!-- Category & System Pill -->
  <g transform="translate(80, 190)">
    <rect x="0" y="0" width="360" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="16" cy="17" r="5" fill="#FF6B00"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#94A3B8" letter-spacing="1">PRODUCT SHOWCASES</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="42" fill="#FFFFFF">
    <tspan x="80" dy="0">Frameless Direct-Drive Stator/Rotor Kit</tspan>
    <tspan x="80" dy="50" fill="#38BDF8"></tspan>
  </text>

  <!-- Center Artwork: Exploded View / Component Callout Schematic -->
  <g transform="translate(80, 385)">
    <rect width="1040" height="445" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Blueprint grid markings -->
    <path d="M 20 40 L 20 20 L 40 20" stroke="#38BDF8" stroke-width="2" fill="none"/>
    <path d="M 1020 40 L 1020 20 L 1000 20" stroke="#38BDF8" stroke-width="2" fill="none"/>
    <path d="M 20 405 L 20 425 L 40 425" stroke="#38BDF8" stroke-width="2" fill="none"/>
    <path d="M 1020 405 L 1020 425 L 1000 425" stroke="#38BDF8" stroke-width="2" fill="none"/>
    <text x="40" y="45" font-family="monospace" font-size="12" fill="#64748B" letter-spacing="1.5">HARDWARE EXPLODED VIEW // COMPONENT CALLOUTS</text>

    <!-- Concentric Subassembly Vectors -->
    <g transform="translate(520, 225)">
      <!-- Outer stator / housing ring -->
      <circle cx="0" cy="0" r="150" stroke="#0066CC" stroke-width="3" fill="none" opacity="0.4"/>
      <circle cx="0" cy="0" r="130" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
      
      <!-- Inner flexspline / rotor element -->
      <circle cx="0" cy="0" r="85" stroke="#FF6B00" stroke-width="3.5" fill="rgba(0,102,204,0.15)"/>
      
      <!-- Hollow center through-bore -->
      <circle cx="0" cy="0" r="45" stroke="#10B981" stroke-width="3" fill="#060E1A"/>
      <text x="0" y="5" font-family="monospace" font-size="11" fill="#6EE7B7" text-anchor="middle" font-weight="bold">HOLLOW BORE</text>

      <!-- Callout pointer 1: Output Flange -->
      <line x1="85" y1="-85" x2="220" y2="-130" stroke="#38BDF8" stroke-width="1.5"/>
      <circle cx="220" cy="-130" r="4" fill="#38BDF8"/>
      <rect x="230" y="-148" width="190" height="34" rx="6" fill="#0B1A2E" stroke="#38BDF8" stroke-width="1"/>
      <text x="240" y="-127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold">Output Bearing Flange</text>

      <!-- Callout pointer 2: Flexspline Element -->
      <line x1="-80" y1="-50" x2="-220" y2="-100" stroke="#FF6B00" stroke-width="1.5"/>
      <circle cx="-220" cy="-100" r="4" fill="#FF6B00"/>
      <rect x="-420" y="-118" width="190" height="34" rx="6" fill="#0B1A2E" stroke="#FF6B00" stroke-width="1"/>
      <text x="-410" y="-97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold">Elastic Flexspline Cup</text>

      <!-- Callout pointer 3: Wave Generator / Rotor -->
      <line x1="60" y1="60" x2="200" y2="120" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="200" cy="120" r="4" fill="#10B981"/>
      <rect x="210" y="102" width="190" height="34" rx="6" fill="#0B1A2E" stroke="#10B981" stroke-width="1"/>
      <text x="220" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold">Elliptical Wave Bearing</text>

      <!-- Callout pointer 4: Dual Absolute Encoders -->
      <line x1="-60" y1="60" x2="-200" y2="120" stroke="#F59E0B" stroke-width="1.5"/>
      <circle cx="-200" cy="120" r="4" fill="#F59E0B"/>
      <rect x="-400" y="102" width="190" height="34" rx="6" fill="#0B1A2E" stroke="#F59E0B" stroke-width="1"/>
      <text x="-390" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold">23-Bit Optical Encoder</text>
    </g>

    <text x="40" y="415" font-family="monospace" font-size="11" fill="#64748B">CAD SPECIFICATION MODEL // INDUS SUBSYSTEMS ARCHITECTURE</text>
  </g>

  <!-- 4 Metrics Cards -->
  <g transform="translate(80, 860)">
    
    <g transform="translate(0, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Torque Density</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">3.2 N·m/kg</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#0066CC" stroke-width="2"/>
    </g>
    <g transform="translate(266, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Hollow Bore</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">Up to 110 mm</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#FF6B00" stroke-width="2"/>
    </g>
    <g transform="translate(532, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Slot Fill</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">82% Copper</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#10B981" stroke-width="2"/>
    </g>
    <g transform="translate(798, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Insulation</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">Class H 180°C</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#F59E0B" stroke-width="2"/>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(80, 1050)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748B" font-weight="600">PRECISION MOTION SYSTEMS // HARDWARE SPECIFICATION SHEET</text>
    <text x="1040" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#38BDF8" font-weight="700" text-anchor="end">indusrobotics.com</text>
  </g>
</svg>