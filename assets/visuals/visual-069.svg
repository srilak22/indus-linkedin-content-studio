<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="bgGradE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="50%" stop-color="#0B192A"/>
      <stop offset="100%" stop-color="#15263B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bgGradE)"/>

  <!-- Accents -->
  <circle cx="500" cy="500" r="260" fill="#0879E8" opacity="0.1" filter="blur(80px)"/>

  <!-- Outer frame -->
  <rect x="40" y="40" width="1120" height="1120" rx="16" fill="none" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
  <line x1="40" y1="140" x2="1160" y2="140" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(80, 68)">
    <polygon points="0,0 26,0 38,20 26,40 0,40 12,20" fill="#0879E8"/>
    <circle cx="19" cy="20" r="6" fill="#FF8A30"/>
    <text x="56" y="22" font-family="'Manrope', sans-serif" font-weight="900" font-size="22" fill="#F4F7FB" letter-spacing="2">INDUS</text>
    <text x="56" y="37" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#A8B6C8" letter-spacing="2">ENGINEERING ACADEMY</text>
  </g>

  <!-- Badges -->
  <g transform="translate(800, 75)">
    <rect x="0" y="0" width="140" height="34" rx="17" fill="rgba(8, 121, 232, 0.2)" stroke="#0879E8" stroke-width="1.2"/>
    <text x="70" y="22" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#20B8F5" text-anchor="middle">INDUS-LI-069</text>
    
    <rect x="155" y="0" width="165" height="34" rx="17" fill="rgba(255, 138, 48, 0.15)" stroke="#FF8A30" stroke-width="1.2"/>
    <text x="237" y="22" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#FF8A30" text-anchor="middle">TECHNICAL EXPLAINER</text>
  </g>

  <!-- Category Pill -->
  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="340" height="32" rx="8" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#FF8A30"/>
    <text x="32" y="21" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#A8B6C8" letter-spacing="1">EDUCATIONAL CONTENT</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="270" font-family="'Manrope', sans-serif" font-weight="900" font-size="44" fill="#F4F7FB">
    <tspan x="80" dy="0">How Machine Vision Works</tspan>
    <tspan x="80" dy="54" fill="#FF8A30"></tspan>
  </text>

  <!-- Comparative Mechanical Matrix -->
  <g transform="translate(80, 380)">
    <rect width="1040" height="450" rx="16" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>

    <!-- Comparison 3 Columns -->
    <g transform="translate(60, 60)">
      <rect width="270" height="280" rx="12" fill="#15263B" stroke="#0879E8" stroke-width="1.5"/>
      <text x="24" y="38" font-family="'Manrope', sans-serif" font-size="17" font-weight="800" fill="#F4F7FB">Strain Wave</text>
      <text x="24" y="62" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8">Flexspline Conjugate Mesh</text>
      <line x1="24" y1="85" x2="246" y2="85" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1"/>
      <text x="24" y="120" font-family="'JetBrains Mono', monospace" font-size="12" fill="#20B8F5">Backlash: &lt; 0.1 arcmin</text>
      <text x="24" y="150" font-family="'JetBrains Mono', monospace" font-size="12" fill="#20B8F5">Weight: Ultra-Lightweight</text>
      <text x="24" y="180" font-family="'JetBrains Mono', monospace" font-size="12" fill="#16B981">Best For: Robot Wrists</text>
    </g>

    <g transform="translate(385, 60)">
      <rect width="270" height="280" rx="12" fill="#15263B" stroke="#20B8F5" stroke-width="1.5"/>
      <text x="24" y="38" font-family="'Manrope', sans-serif" font-size="17" font-weight="800" fill="#F4F7FB">RV Cycloidal</text>
      <text x="24" y="62" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8">Pin-Wheel Dual Eccentric</text>
      <line x1="24" y1="85" x2="246" y2="85" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1"/>
      <text x="24" y="120" font-family="'JetBrains Mono', monospace" font-size="12" fill="#20B8F5">Shock: 500% Emergency</text>
      <text x="24" y="150" font-family="'JetBrains Mono', monospace" font-size="12" fill="#20B8F5">Stiffness: Extreme</text>
      <text x="24" y="180" font-family="'JetBrains Mono', monospace" font-size="12" fill="#16B981">Best For: Base / Shoulder</text>
    </g>

    <g transform="translate(710, 60)">
      <rect width="270" height="280" rx="12" fill="#15263B" stroke="#FF8A30" stroke-width="1.5"/>
      <text x="24" y="38" font-family="'Manrope', sans-serif" font-size="17" font-weight="800" fill="#F4F7FB">Planetary</text>
      <text x="24" y="62" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8">Sun-Planet Carrier Mesh</text>
      <line x1="24" y1="85" x2="246" y2="85" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1"/>
      <text x="24" y="120" font-family="'JetBrains Mono', monospace" font-size="12" fill="#20B8F5">Speed: High Input RPM</text>
      <text x="24" y="150" font-family="'JetBrains Mono', monospace" font-size="12" fill="#20B8F5">Cost: Balanced</text>
      <text x="24" y="180" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FF8A30">Best For: Linear Drives</text>
    </g>

    <text x="40" y="420" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A8B6C8">KINEMATIC SELECTION GUIDE // COMPARATIVE GEARBOX TAXONOMY</text>
  </g>

  <!-- Metrics Grid -->
  <g transform="translate(80, 860)">
    
    <g transform="translate(0, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Illumination Geometry</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#0879E8" font-weight="700">Brightfield, Darkfield, Backlight, Coaxial Lighting</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#0879E8" stroke-width="2.5"/>
    </g>
    <g transform="translate(265, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Lens Architecture</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#20B8F5" font-weight="700">Telecentric Optics (Zero Perspective Distortion)</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#20B8F5" stroke-width="2.5"/>
    </g>
    <g transform="translate(530, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Shutter Technology</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#FF8A30" font-weight="700">Global Shutter (Zero High-Speed Motion Blur)</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#FF8A30" stroke-width="2.5"/>
    </g>
    <g transform="translate(795, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Processing Engine</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#16B981" font-weight="700">Rule-Based Geometric Pattern Matching + Deep Learning</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#16B981" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 1050)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
    <text x="0" y="38" font-family="'Inter', sans-serif" font-size="13" fill="#A8B6C8" font-weight="600">ENGINEERING EDUCATION // PRECISION ROBOTICS FUNDAMENTALS</text>
    <text x="1040" y="38" font-family="'JetBrains Mono', monospace" font-size="13" fill="#20B8F5" font-weight="700" text-anchor="end">indusrobotics.com</text>
  </g>
</svg>