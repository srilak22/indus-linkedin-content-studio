<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="bgGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="50%" stop-color="#0B192A"/>
      <stop offset="100%" stop-color="#15263B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bgGradC)"/>

  <!-- Accents -->
  <circle cx="850" cy="300" r="260" fill="#0879E8" opacity="0.1" filter="blur(80px)"/>

  <!-- Outer frame -->
  <rect x="40" y="40" width="1120" height="1120" rx="16" fill="none" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
  <line x1="40" y1="140" x2="1160" y2="140" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(80, 68)">
    <polygon points="0,0 26,0 38,20 26,40 0,40 12,20" fill="#0879E8"/>
    <circle cx="19" cy="20" r="6" fill="#16B981"/>
    <text x="56" y="22" font-family="'Manrope', sans-serif" font-weight="900" font-size="22" fill="#F4F7FB" letter-spacing="2">INDUS</text>
    <text x="56" y="37" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#A8B6C8" letter-spacing="2">INDUSTRIAL SOLUTIONS</text>
  </g>

  <!-- Badges -->
  <g transform="translate(800, 75)">
    <rect x="0" y="0" width="140" height="34" rx="17" fill="rgba(8, 121, 232, 0.2)" stroke="#0879E8" stroke-width="1.2"/>
    <text x="70" y="22" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#20B8F5" text-anchor="middle">INDUS-LI-005</text>
    
    <rect x="155" y="0" width="165" height="34" rx="17" fill="rgba(22, 185, 129, 0.15)" stroke="#16B981" stroke-width="1.2"/>
    <text x="237" y="22" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#16B981" text-anchor="middle">FACTORY INTEGRATION</text>
  </g>

  <!-- Category Pill -->
  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="340" height="32" rx="8" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#16B981"/>
    <text x="32" y="21" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#A8B6C8" letter-spacing="1">INDUSTRY APPLICATIONS</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="270" font-family="'Manrope', sans-serif" font-weight="900" font-size="44" fill="#F4F7FB">
    <tspan x="80" dy="0">Industrial AMR Navigation Architecture</tspan>
    <tspan x="80" dy="54" fill="#16B981"></tspan>
  </text>

  <!-- Factory Architecture Blueprint -->
  <g transform="translate(80, 380)">
    <rect width="1040" height="450" rx="16" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>

    <!-- Workcell Cells Grid -->
    <g transform="translate(80, 60)">
      <rect width="260" height="280" rx="12" fill="#15263B" stroke="#0879E8" stroke-width="1.5"/>
      <text x="24" y="40" font-family="'Manrope', sans-serif" font-size="17" font-weight="800" fill="#F4F7FB">Cell 01: Infeed</text>
      <text x="24" y="65" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8">High-speed tray staging</text>
      <line x1="24" y1="90" x2="236" y2="90" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1"/>
      <text x="24" y="125" font-family="'JetBrains Mono', monospace" font-size="12" fill="#20B8F5">Payload: 20 kg</text>
      <text x="24" y="155" font-family="'JetBrains Mono', monospace" font-size="12" fill="#20B8F5">Cycle: 2.4 sec</text>
      <text x="24" y="185" font-family="'JetBrains Mono', monospace" font-size="12" fill="#16B981">Cleanroom ISO 5</text>
    </g>

    <!-- Transfer Connection -->
    <line x1="340" y1="200" x2="390" y2="200" stroke="#16B981" stroke-width="3" stroke-dasharray="6 4"/>

    <g transform="translate(390, 60)">
      <rect width="260" height="280" rx="12" fill="#15263B" stroke="#16B981" stroke-width="1.5"/>
      <text x="24" y="40" font-family="'Manrope', sans-serif" font-size="17" font-weight="800" fill="#F4F7FB">Cell 02: Precision</text>
      <text x="24" y="65" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8">6-Axis Active Assembly</text>
      <line x1="24" y1="90" x2="236" y2="90" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1"/>
      <text x="24" y="125" font-family="'JetBrains Mono', monospace" font-size="12" fill="#20B8F5">Repeatability: ±0.02 mm</text>
      <text x="24" y="155" font-family="'JetBrains Mono', monospace" font-size="12" fill="#20B8F5">Force Sensing: 6-Axis F/T</text>
      <text x="24" y="185" font-family="'JetBrains Mono', monospace" font-size="12" fill="#16B981">Continuous S1 Duty</text>
    </g>

    <!-- Transfer Connection -->
    <line x1="650" y1="200" x2="700" y2="200" stroke="#FF8A30" stroke-width="3" stroke-dasharray="6 4"/>

    <g transform="translate(700, 60)">
      <rect width="260" height="280" rx="12" fill="#15263B" stroke="#FF8A30" stroke-width="1.5"/>
      <text x="24" y="40" font-family="'Manrope', sans-serif" font-size="17" font-weight="800" fill="#F4F7FB">Cell 03: Outfeed</text>
      <text x="24" y="65" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8">Autonomous Mobile Transit</text>
      <line x1="24" y1="90" x2="236" y2="90" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1"/>
      <text x="24" y="125" font-family="'JetBrains Mono', monospace" font-size="12" fill="#20B8F5">LiDAR SLAM 360°</text>
      <text x="24" y="155" font-family="'JetBrains Mono', monospace" font-size="12" fill="#20B8F5">Payload: 500 kg AMR</text>
      <text x="24" y="185" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FF8A30">Fleet Dispatcher v2</text>
    </g>

    <text x="40" y="420" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A8B6C8">FIELD INTEGRATION TOPOLOGY // WORKCELL AUTOMATION BOUNDARY</text>
  </g>

  <!-- Metrics Grid -->
  <g transform="translate(80, 860)">
    
    <g transform="translate(0, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Payload</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#0879E8" font-weight="700">1,500 kg</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#0879E8" stroke-width="2.5"/>
    </g>
    <g transform="translate(265, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Max Velocity</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#20B8F5" font-weight="700">1.8 m/s</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#20B8F5" stroke-width="2.5"/>
    </g>
    <g transform="translate(530, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Mapping</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#FF8A30" font-weight="700">LiDAR SLAM</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#FF8A30" stroke-width="2.5"/>
    </g>
    <g transform="translate(795, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Battery</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#16B981" font-weight="700">LiFePO4 1C</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#16B981" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 1050)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
    <text x="0" y="38" font-family="'Inter', sans-serif" font-size="13" fill="#A8B6C8" font-weight="600">SECTOR ENGINEERING // AUTOMATION DEPLOYMENT SERIES</text>
    <text x="1040" y="38" font-family="'JetBrains Mono', monospace" font-size="13" fill="#20B8F5" font-weight="700" text-anchor="end">indusrobotics.com</text>
  </g>
</svg>