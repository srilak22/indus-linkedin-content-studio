<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="bgGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="50%" stop-color="#0B192A"/>
      <stop offset="100%" stop-color="#15263B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(8, 121, 232, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="1200" fill="url(#bgGradA)"/>
  <rect width="1200" height="1200" fill="url(#grid)"/>

  <!-- Accents -->
  <circle cx="220" cy="220" r="260" fill="#0879E8" opacity="0.12" filter="blur(80px)"/>
  <circle cx="980" cy="980" r="260" fill="#20B8F5" opacity="0.08" filter="blur(90px)"/>

  <!-- Outer frame -->
  <rect x="40" y="40" width="1120" height="1120" rx="16" fill="none" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
  <line x1="40" y1="140" x2="1160" y2="140" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(80, 68)">
    <polygon points="0,0 26,0 38,20 26,40 0,40 12,20" fill="#0879E8"/>
    <circle cx="19" cy="20" r="6" fill="#FF8A30"/>
    <text x="56" y="22" font-family="'Manrope', sans-serif" font-weight="900" font-size="22" fill="#F4F7FB" letter-spacing="2">INDUS</text>
    <text x="56" y="37" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#A8B6C8" letter-spacing="2">PRECISION MOTION SYSTEMS</text>
  </g>

  <!-- Badges -->
  <g transform="translate(800, 75)">
    <rect x="0" y="0" width="140" height="34" rx="17" fill="rgba(8, 121, 232, 0.2)" stroke="#0879E8" stroke-width="1.2"/>
    <text x="70" y="22" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#20B8F5" text-anchor="middle">INDUS-LI-003</text>
    
    <rect x="155" y="0" width="165" height="34" rx="17" fill="rgba(22, 185, 129, 0.15)" stroke="#16B981" stroke-width="1.2"/>
    <text x="237" y="22" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#16B981" text-anchor="middle">PRODUCT SPOTLIGHT</text>
  </g>

  <!-- Category & System Pill -->
  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="340" height="32" rx="8" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#FF8A30"/>
    <text x="32" y="21" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#A8B6C8" letter-spacing="1">PRODUCT SHOWCASES</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="270" font-family="'Manrope', sans-serif" font-weight="900" font-size="44" fill="#F4F7FB">
    <tspan x="80" dy="0">6-Axis Heavy Manipulator</tspan>
    <tspan x="80" dy="54" fill="#20B8F5"></tspan>
  </text>

  <!-- Blueprint Schematic Centerpiece -->
  <g transform="translate(80, 380)">
    <rect width="1040" height="450" rx="16" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
    <circle cx="520" cy="225" r="160" fill="none" stroke="#0879E8" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="520" cy="225" r="120" fill="none" stroke="#20B8F5" stroke-width="2.5"/>
    <circle cx="520" cy="225" r="70" fill="#0B192A" stroke="#FF8A30" stroke-width="2"/>
    <circle cx="520" cy="225" r="18" fill="#0879E8"/>

    <!-- Crosshair axes -->
    <line x1="200" y1="225" x2="840" y2="225" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="520" y1="45" x2="520" y2="405" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Callouts -->
    <g transform="translate(140, 100)">
      <rect width="170" height="54" rx="8" fill="#15263B" stroke="#0879E8" stroke-width="1"/>
      <text x="14" y="24" font-family="'Inter', sans-serif" font-size="11" fill="#A8B6C8">Flexspline Alloy</text>
      <text x="14" y="42" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#20B8F5">DIN 1.8519</text>
      <line x1="170" y1="27" x2="380" y2="175" stroke="#0879E8" stroke-width="1.5"/>
      <circle cx="380" cy="175" r="4" fill="#0879E8"/>
    </g>

    <g transform="translate(730, 290)">
      <rect width="170" height="54" rx="8" fill="#15263B" stroke="#FF8A30" stroke-width="1"/>
      <text x="14" y="24" font-family="'Inter', sans-serif" font-size="11" fill="#A8B6C8">Wave Generator</text>
      <text x="14" y="42" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#FF8A30">Elliptical Cam</text>
      <line x1="0" y1="27" x2="-140" y2="-40" stroke="#FF8A30" stroke-width="1.5"/>
      <circle cx="-140" cy="-40" r="4" fill="#FF8A30"/>
    </g>

    <text x="40" y="420" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A8B6C8">CROSS-SECTION SCHEMATIC // ROTATIONAL JOINT ACTUATION</text>
  </g>

  <!-- Metrics Grid -->
  <g transform="translate(80, 860)">
    
    <g transform="translate(0, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Max Payload</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#0879E8" font-weight="700">210 kg</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#0879E8" stroke-width="2.5"/>
    </g>
    <g transform="translate(265, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Max Reach</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#20B8F5" font-weight="700">2,650 mm</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#20B8F5" stroke-width="2.5"/>
    </g>
    <g transform="translate(530, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Repeatability</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#FF8A30" font-weight="700">± 0.03 mm</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#FF8A30" stroke-width="2.5"/>
    </g>
    <g transform="translate(795, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Sealing</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#16B981" font-weight="700">IP67 Sealed</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#16B981" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 1050)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
    <text x="0" y="38" font-family="'Inter', sans-serif" font-size="13" fill="#A8B6C8" font-weight="600">TECHNICAL CATALOG SERIES // ZERO-DEFECT COMMISSIONING</text>
    <text x="1040" y="38" font-family="'JetBrains Mono', monospace" font-size="13" fill="#20B8F5" font-weight="700" text-anchor="end">indusrobotics.com</text>
  </g>
</svg>