<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="bgGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07101F"/>
      <stop offset="50%" stop-color="#0D1E36"/>
      <stop offset="100%" stop-color="#162D4A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bgGradF)"/>

  <!-- Frame -->
  <rect x="40" y="40" width="1120" height="1120" rx="20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <line x1="40" y1="150" x2="1160" y2="150" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(80, 70)">
    <polygon points="0,0 28,0 42,22 28,45 0,45 14,22" fill="#0066CC"/>
    <circle cx="21" cy="22" r="7" fill="#FF6B00"/>
    <text x="60" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="2">INDUS</text>
    <text x="60" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#94A3B8" letter-spacing="2.5">ENGINEERING EXCELLENCE</text>
  </g>

  <g transform="translate(820, 80)">
    <rect x="0" y="0" width="130" height="32" rx="16" fill="rgba(0,102,204,0.2)" stroke="#0066CC" stroke-width="1"/>
    <text x="65" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#60A5FA" text-anchor="middle">INDUS-LI-099</text>
    
    <rect x="145" y="0" width="155" height="32" rx="16" fill="rgba(245,158,11,0.15)" stroke="#F59E0B" stroke-width="1"/>
    <text x="222" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#FCD34D" text-anchor="middle">STRATEGIC DOSSIER</text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(80, 190)">
    <rect x="0" y="0" width="360" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="16" cy="17" r="5" fill="#F59E0B"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#94A3B8" letter-spacing="1">CAREERS & TALENT</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="42" fill="#FFFFFF">
    <tspan x="80" dy="0">Industrial Automation &amp; PLC Integration</tspan>
    <tspan x="80" dy="50" fill="#38BDF8"></tspan>
  </text>

  <!-- Center Artwork: Engineering Metrology & Standards Framework -->
  <g transform="translate(80, 385)">
    <rect width="1040" height="445" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <text x="40" y="45" font-family="monospace" font-size="12" fill="#64748B" letter-spacing="1.5">METROLOGY LABORATORY STANDARDS // TESTING METHODOLOGY</text>

    <!-- Standards Matrix Cards -->
    <g transform="translate(50, 90)">
      <!-- Standard 1 -->
      <g transform="translate(0, 0)">
        <rect width="450" height="130" rx="10" fill="#0B1C33" stroke="#0066CC" stroke-width="1.5"/>
        <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">ISO 9283 Dynamic Performance</text>
        <text x="24" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">3D Laser tracking dynamic path accuracy and multi-cycle pose repeatability validation.</text>
        <text x="24" y="105" font-family="monospace" font-size="12" fill="#38BDF8">Benchmark: ±0.03 mm Repeatability Window</text>
      </g>

      <!-- Standard 2 -->
      <g transform="translate(490, 0)">
        <rect width="450" height="130" rx="10" fill="#0B1C33" stroke="#10B981" stroke-width="1.5"/>
        <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">Accelerated Life Torture Testing</text>
        <text x="24" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">10 Million continuous reversing torque cycles at 150% rated load on dynamic dynamometers.</text>
        <text x="24" y="105" font-family="monospace" font-size="12" fill="#34D399">Standard: 20,000 Operating Hours Design Life</text>
      </g>

      <!-- Standard 3 -->
      <g transform="translate(0, 155)">
        <rect width="450" height="130" rx="10" fill="#0B1C33" stroke="#FF6B00" stroke-width="1.5"/>
        <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">Thermal Environmental Chambers</text>
        <text x="24" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Sealed thermal stress cycling from -40°C to +120°C testing seal durometer and synthetic grease.</text>
        <text x="24" y="105" font-family="monospace" font-size="12" fill="#FDBA74">Range: -40°C to +120°C Severe Shock</text>
      </g>

      <!-- Standard 4 -->
      <g transform="translate(490, 155)">
        <rect width="450" height="130" rx="10" fill="#0B1C33" stroke="#F59E0B" stroke-width="1.5"/>
        <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">Sub-Micron Cleanroom Grinding</text>
        <text x="24" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Climate-controlled gear flank grinding at 20.0°C ±0.2°C holding 0.8 µm tooth profile tolerances.</text>
        <text x="24" y="105" font-family="monospace" font-size="12" fill="#FCD34D">Tolerance: &lt; 0.8 µm Flank Precision</text>
      </g>
    </g>

    <text x="40" y="425" font-family="monospace" font-size="11" fill="#64748B">INDUS METROLOGY DIVISION // RIGOROUS HARDWARE VERIFICATION</text>
  </g>

  <!-- 4 Metrics Cards -->
  <g transform="translate(80, 860)">
    
    <g transform="translate(0, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Discipline</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">Lead Industrial Automation Commissioning Engineer</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#0066CC" stroke-width="2"/>
    </g>
    <g transform="translate(266, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Standards</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">IEC 61131-3 (Structured Text, Function Block Diagrams)</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#FF6B00" stroke-width="2"/>
    </g>
    <g transform="translate(532, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Key Platforms</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">Beckhoff TwinCAT 3, Siemens TIA Portal, Rockwell Studio 5000</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#10B981" stroke-width="2"/>
    </g>
    <g transform="translate(798, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Field Experience</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">Robotic workcell integration, safety interlocking, HMI UX</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#F59E0B" stroke-width="2"/>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 1050)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748B" font-weight="600">ENTERPRISE AUTOMATION // ENGINEERING-FIRST STRATEGY</text>
    <text x="1040" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#38BDF8" font-weight="700" text-anchor="end">indusrobotics.com</text>
  </g>
</svg>