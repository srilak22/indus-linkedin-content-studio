<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="bgGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1E"/>
      <stop offset="50%" stop-color="#0E1E34"/>
      <stop offset="100%" stop-color="#162942"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(56,189,248,0.35)"/>
      <stop offset="100%" stop-color="rgba(56,189,248,0.0)"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bgGradB)"/>

  <!-- Frame -->
  <rect x="40" y="40" width="1120" height="1120" rx="20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <line x1="40" y1="150" x2="1160" y2="150" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(80, 70)">
    <polygon points="0,0 28,0 42,22 28,45 0,45 14,22" fill="#0066CC"/>
    <circle cx="21" cy="22" r="7" fill="#FF6B00"/>
    <text x="60" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="2">INDUS</text>
    <text x="60" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#94A3B8" letter-spacing="2.5">ENGINEERING INSIGHTS</text>
  </g>

  <g transform="translate(820, 80)">
    <rect x="0" y="0" width="130" height="32" rx="16" fill="rgba(0,102,204,0.2)" stroke="#0066CC" stroke-width="1"/>
    <text x="65" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#60A5FA" text-anchor="middle">INDUS-LI-008</text>
    
    <rect x="145" y="0" width="155" height="32" rx="16" fill="rgba(56,189,248,0.15)" stroke="#38BDF8" stroke-width="1"/>
    <text x="222" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#7DD3FC" text-anchor="middle">TECHNICAL INFOGRAPHIC</text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(80, 190)">
    <rect x="0" y="0" width="360" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle cx="16" cy="17" r="5" fill="#38BDF8"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#94A3B8" letter-spacing="1">PRODUCT SHOWCASES</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="42" fill="#FFFFFF">
    <tspan x="80" dy="0">Ironless Linear Motor Dynamics</tspan>
    <tspan x="80" dy="50" fill="#38BDF8"></tspan>
  </text>

  <!-- Center Artwork: Engineering Chart / Hysteresis or Stiffness Curve -->
  <g transform="translate(80, 385)">
    <rect width="1040" height="445" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <text x="40" y="45" font-family="monospace" font-size="12" fill="#64748B" letter-spacing="1.5">TORSIONAL RIGIDITY &amp; HYSTERESIS CHARACTERISTIC CURVE</text>

    <!-- Graph Axis -->
    <g transform="translate(140, 240)">
      <!-- X & Y Axes -->
      <line x1="0" y1="130" x2="800" y2="130" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
      <line x1="80" y1="-120" x2="80" y2="130" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
      <text x="800" y="155" font-family="monospace" font-size="12" fill="#94A3B8" text-anchor="end">Torque Load τ (N·m)</text>
      <text x="65" y="-130" font-family="monospace" font-size="12" fill="#94A3B8">Torsional Angle θ (arcmin)</text>

      <!-- Curve Fill Area -->
      <path d="M 80 130 C 260 120 440 20 720 -80 L 720 130 Z" fill="url(#curveGrad)"/>

      <!-- Primary High-Stiffness Curve (INDUS) -->
      <path d="M 80 130 C 260 120 440 20 720 -80" stroke="#38BDF8" stroke-width="4" fill="none"/>
      <circle cx="720" cy="-80" r="6" fill="#38BDF8"/>
      <text x="735" y="-75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#38BDF8" font-weight="bold">Zero-Backlash Strain Wave (Rigid Curve)</text>

      <!-- Secondary Standard Backlash Curve -->
      <path d="M 160 130 C 340 125 500 70 720 -20" stroke="#FF6B00" stroke-width="3" stroke-dasharray="8 5" fill="none"/>
      <text x="735" y="-15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#FDBA74">Standard Planetary (3-5 arcmin Backlash)</text>

      <!-- Deadband Indicator -->
      <line x1="80" y1="130" x2="160" y2="130" stroke="#EF4444" stroke-width="4"/>
      <text x="120" y="115" font-family="monospace" font-size="11" fill="#F87171" text-anchor="middle" font-weight="bold">Backlash Gap</text>
    </g>

    <text x="40" y="415" font-family="monospace" font-size="11" fill="#64748B">ISO 9283 TESTING PROTOCOL // DYNAMIC TORSIONAL COMPLIANCE</text>
  </g>

  <!-- 4 Metrics Cards -->
  <g transform="translate(80, 860)">
    
    <g transform="translate(0, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Acceleration</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">10G Peak</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#0066CC" stroke-width="2"/>
    </g>
    <g transform="translate(266, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Cogging</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">Zero Cogging</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#FF6B00" stroke-width="2"/>
    </g>
    <g transform="translate(532, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Peak Force</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">1,800 N</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#10B981" stroke-width="2"/>
    </g>
    <g transform="translate(798, 0)">
      <rect width="242" height="135" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8" font-weight="600">Settling</text>
      <text x="24" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38BDF8" font-weight="800">&lt; 5 ms</text>
      <line x1="24" y1="105" x2="80" y2="105" stroke="#F59E0B" stroke-width="2"/>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 1050)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748B" font-weight="600">KINEMATIC RESEARCH &amp; ANALYSIS // INDUS MOTION LABS</text>
    <text x="1040" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#38BDF8" font-weight="700" text-anchor="end">indusrobotics.com</text>
  </g>
</svg>