<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="bgGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="50%" stop-color="#0B192A"/>
      <stop offset="100%" stop-color="#15263B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bgGradB)"/>

  <!-- Accents -->
  <circle cx="300" cy="300" r="260" fill="#20B8F5" opacity="0.1" filter="blur(80px)"/>

  <!-- Outer frame -->
  <rect x="40" y="40" width="1120" height="1120" rx="16" fill="none" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
  <line x1="40" y1="140" x2="1160" y2="140" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(80, 68)">
    <polygon points="0,0 26,0 38,20 26,40 0,40 12,20" fill="#0879E8"/>
    <circle cx="19" cy="20" r="6" fill="#20B8F5"/>
    <text x="56" y="22" font-family="'Manrope', sans-serif" font-weight="900" font-size="22" fill="#F4F7FB" letter-spacing="2">INDUS</text>
    <text x="56" y="37" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#A8B6C8" letter-spacing="2">ENGINEERING INSIGHTS</text>
  </g>

  <!-- Badges -->
  <g transform="translate(800, 75)">
    <rect x="0" y="0" width="140" height="34" rx="17" fill="rgba(8, 121, 232, 0.2)" stroke="#0879E8" stroke-width="1.2"/>
    <text x="70" y="22" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#20B8F5" text-anchor="middle">INDUS-LI-008</text>
    
    <rect x="155" y="0" width="165" height="34" rx="17" fill="rgba(32, 184, 245, 0.15)" stroke="#20B8F5" stroke-width="1.2"/>
    <text x="237" y="22" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#20B8F5" text-anchor="middle">KINEMATIC DOSSIER</text>
  </g>

  <!-- Category Pill -->
  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="360" height="32" rx="8" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#20B8F5"/>
    <text x="32" y="21" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#A8B6C8" letter-spacing="1">ENGINEERING &amp; TECHNOLOGY INSIGHTS</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="270" font-family="'Manrope', sans-serif" font-weight="900" font-size="44" fill="#F4F7FB">
    <tspan x="80" dy="0">Ironless Linear Motor Dynamics</tspan>
    <tspan x="80" dy="54" fill="#20B8F5"></tspan>
  </text>

  <!-- Kinematic Curves Diagram -->
  <g transform="translate(80, 380)">
    <rect width="1040" height="450" rx="16" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
    
    <!-- Graph Grid Lines -->
    <line x1="80" y1="80" x2="960" y2="80" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1"/>
    <line x1="80" y1="160" x2="960" y2="160" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1"/>
    <line x1="80" y1="240" x2="960" y2="240" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1"/>
    <line x1="80" y1="320" x2="960" y2="320" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1"/>
    
    <!-- Coordinate Axes -->
    <line x1="80" y1="350" x2="980" y2="350" stroke="#A8B6C8" stroke-width="2"/>
    <line x1="80" y1="50" x2="80" y2="350" stroke="#A8B6C8" stroke-width="2"/>
    <text x="980" y="380" font-family="'JetBrains Mono', monospace" font-size="12" fill="#A8B6C8" text-anchor="end">Torque Load [Nm]</text>
    <text x="80" y="35" font-family="'JetBrains Mono', monospace" font-size="12" fill="#A8B6C8">Torsional Angle [arcmin]</text>

    <!-- Curve 1: Harmonic / Flexspline Hysteresis -->
    <path d="M 80 350 Q 300 320 520 220 T 940 90" fill="none" stroke="#20B8F5" stroke-width="3.5"/>
    <path d="M 80 350 Q 280 340 500 240 T 940 115" fill="none" stroke="#20B8F5" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>

    <!-- Curve 2: Planetary with backlash gap -->
    <path d="M 160 350 Q 400 340 600 270 T 940 180" fill="none" stroke="#FF8A30" stroke-width="2.5" stroke-dasharray="4 4"/>

    <!-- Markers -->
    <circle cx="520" cy="220" r="6" fill="#20B8F5"/>
    <text x="540" y="215" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#20B8F5">INDUS Strain-Wave Characteristic</text>

    <text x="40" y="420" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A8B6C8">TORSIONAL HYSTERESIS LOOP // DYNAMIC DEFLECTION TEST MATRIX</text>
  </g>

  <!-- Metrics Grid -->
  <g transform="translate(80, 860)">
    
    <g transform="translate(0, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Acceleration</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#0879E8" font-weight="700">10G Peak</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#0879E8" stroke-width="2.5"/>
    </g>
    <g transform="translate(265, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Cogging</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#20B8F5" font-weight="700">Zero Cogging</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#20B8F5" stroke-width="2.5"/>
    </g>
    <g transform="translate(530, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Peak Force</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#FF8A30" font-weight="700">1,800 N</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#FF8A30" stroke-width="2.5"/>
    </g>
    <g transform="translate(795, 0)">
      <rect width="245" height="120" rx="12" fill="#101F33" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
      <text x="20" y="34" font-family="'Inter', sans-serif" font-size="12" fill="#A8B6C8" font-weight="600">Settling</text>
      <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="20" fill="#16B981" font-weight="700">&lt; 5 ms</text>
      <line x1="20" y1="98" x2="60" y2="98" stroke="#16B981" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80, 1050)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="rgba(148, 163, 184, 0.18)" stroke-width="1.5"/>
    <text x="0" y="38" font-family="'Inter', sans-serif" font-size="13" fill="#A8B6C8" font-weight="600">KINEMATICS ARCHITECTURE // RIGOROUS HARDWARE VERIFICATION</text>
    <text x="1040" y="38" font-family="'JetBrains Mono', monospace" font-size="13" fill="#20B8F5" font-weight="700" text-anchor="end">indusrobotics.com</text>
  </g>
</svg>